# Optional: publishes the demo (browser-only data) to GitHub Pages.
# Manual only (the demo is hosted on Vercel). To use it: Settings → Pages →
# Source: "GitHub Actions", then Actions → "Demo på GitHub Pages" → Run workflow.
name: Demo på GitHub Pages

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: node scripts/prepare-pages.mjs
      - run: npx next build
        env:
          STATIC_EXPORT: '1'
          NEXT_PUBLIC_STATIC_DEMO: '1'
          PAGES_BASE_PATH: /${{ github.event.repository.name }}
          NEXT_TELEMETRY_DISABLED: '1'
      # Without this, Pages' Jekyll step hides the _next/ asset folder.
      - run: touch out/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
