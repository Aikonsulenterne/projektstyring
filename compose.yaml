# Local development database only. Not a production configuration.
#   docker compose up -d db
#   DATABASE_URL=postgresql://teamspace:teamspace@localhost:5432/teamspace npx prisma migrate deploy
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: teamspace
      POSTGRES_PASSWORD: teamspace
      POSTGRES_DB: teamspace
      # UTF-8 locale so case-insensitive search folds æ/ø/å correctly.
      POSTGRES_INITDB_ARGS: --encoding=UTF8 --locale=C.UTF-8
    ports:
      - '127.0.0.1:5432:5432'
    volumes:
      - teamspace-db:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U teamspace']
      interval: 5s
      retries: 10
volumes:
  teamspace-db:
